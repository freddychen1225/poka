<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>Poka 波卡回報</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Poka">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --bg: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.10);
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #app-container {
      width: 100%;
      max-width: 860px;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      padding:
        max(10px, env(safe-area-inset-top))
        20px
        6px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0;
    }

    .header {
      text-align: center;
      padding: 4px 8px 12px;
      min-height: 0;
    }

    .brand-mark {
      display: inline-block;
      margin: 0;
      color: #0f172a;
      font-size: clamp(2.7rem, 8vw, 4.3rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    .brand-sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .button-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr)
        minmax(0, 1fr)
        minmax(0, 1.08fr);
      gap: 12px;
    }

    .status-btn {
      appearance: none;
      min-width: 0;
      min-height: 0;
      border: none;
      border-radius: var(--radius-xl);
      padding: 10px 8px;
      color: #fff;
      background: transparent;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      font-size: clamp(1.6rem, 5.6vw, 2.35rem);
      font-weight: 900;
      line-height: 1.08;
      touch-action: manipulation;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .status-btn:active {
      transform: scale(0.985);
      filter: brightness(0.97);
    }

    /* 原有亮色按鈕 */
    .btn-green  { background: #3f861d; } /* 我到了 */
    .btn-blue   { background: #126e9f; } /* 我晚一點 */
    .btn-yellow { background: #d8a100; } /* 跟同學在一起 */
    .btn-orange { background: #e07a00; } /* 暫時不方便接 */

    /* 新增較柔和顏色 */
    .btn-soft-teal { background: #2f6f72; } /* 我出門了 */
    .btn-soft-navy { background: #374151; } /* 我到家了 */

    .btn-red {
      background: #ab3648;
      grid-column: 1 / -1;
      font-size: clamp(1.8rem, 6.2vw, 2.55rem);
    }

    .app-footer {
      width: 100%;
      min-height: 0;
      padding:
        7px
        20px
        max(8px, env(safe-area-inset-bottom));
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.45);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 24px 20px;
      background: #ffffff;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
      text-align: center;
    }

    .modal-box h2 {
      margin: 0 0 10px;
      color: #0f172a;
      font-size: 26px;
    }

    .modal-box p {
      margin: 0;
      color: #475569;
      font-size: 16px;
      line-height: 1.6;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-modal {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-modal.cancel {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-modal.confirm {
      background: #0f766e;
      color: #fff;
    }

    /* 一般手機窄螢幕 */
    @media (max-width: 480px) {
      #app-container {
        padding-right: 14px;
        padding-left: 14px;
      }

      .button-grid {
        gap: 10px;
      }

      .status-btn {
        border-radius: 26px;
        padding: 8px 7px;
      }

      .app-footer {
        padding-right: 14px;
        padding-left: 14px;
      }
    }

    /*
      iPhone 12 與其他可用高度較短的直向 PWA：
      縮小標題、間距、字體與 Footer 高度，
      但不允許頁面捲動。
    */
    @media (max-width: 480px) and (max-height: 850px) {
      #app-container {
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: 4px;
      }

      .header {
        padding-top: 2px;
        padding-bottom: 8px;
      }

      .brand-mark {
        font-size: clamp(2.45rem, 7.4vw, 3.55rem);
      }

      .brand-sub {
        margin-top: 5px;
        font-size: clamp(0.9rem, 2.8vw, 1.05rem);
      }

      .button-grid {
        gap: 8px;
      }

      .status-btn {
        border-radius: 24px;
        font-size: clamp(1.42rem, 5.2vw, 1.95rem);
        line-height: 1.04;
      }

      .btn-red {
        font-size: clamp(1.62rem, 5.7vw, 2.1rem);
      }

      .app-footer {
        padding-top: 5px;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        font-size: 12px;
      }
    }

    /*
      非常短的裝置高度保護：
      仍保留所有按鈕、SOS 與 Footer，
      但以較緊湊比例呈現。
    */
    @media (max-width: 480px) and (max-height: 720px) {
      .brand-mark {
        font-size: 2.35rem;
      }

      .brand-sub {
        display: none;
      }

      .header {
        padding-bottom: 6px;
      }

      .button-grid {
        gap: 7px;
      }

      .status-btn {
        border-radius: 22px;
        font-size: 1.28rem;
        padding: 6px;
      }

      .btn-red {
        font-size: 1.48rem;
      }

      .app-footer {
        font-size: 11px;
        padding-top: 4px;
      }
    }
  </style>
</head>
<body>
  <main id="app-container">
    <div class="header">
      <h1 class="brand-mark">Poka</h1>
      <p id="system-msg" class="brand-sub">請點擊下方狀態回報</p>
    </div>

    <div class="button-grid">
      <button class="status-btn btn-green" onclick="reportStatus('arrived')">
        我到了
      </button>

      <button class="status-btn btn-blue" onclick="reportStatus('delayed')">
        我晚一點
      </button>

      <button class="status-btn btn-yellow" onclick="reportStatus('with_friend')">
        跟同學<br>在一起
      </button>

      <button class="status-btn btn-orange" onclick="reportStatus('busy')">
        暫時<br>不方便接
      </button>

      <button class="status-btn btn-soft-teal" onclick="reportStatus('left_home')">
        我出門了
      </button>

      <button class="status-btn btn-soft-navy" onclick="reportStatus('arrived_home')">
        我到家了
      </button>

      <button class="status-btn btn-red">
        SOS 緊急求助
      </button>
    </div>
  </main>

  <footer class="app-footer">Freddy &amp; Perplexity 共同協作</footer>

  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title">確認送出？</h2>
      <p id="modal-desc">您即將傳送狀態與位置給家長</p>
      <div class="modal-buttons">
        <button id="btn-cancel" class="btn-modal cancel">取消</button>
        <button id="btn-confirm" class="btn-modal confirm">確定送出</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker 註冊成功!', reg))
          .catch((err) => console.log('Service Worker 註冊失敗!', err));
      });
    }
  </script>
</body>
</html>
